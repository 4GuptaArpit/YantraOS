<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge Background with Precision Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2"/>
  
  <!-- Subtle Microgrid Circuit Lines -->
  <path d="M 12 12 L 20 12 L 20 20" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5"/>
  <path d="M 52 12 L 44 12 L 44 20" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5"/>
  <path d="M 12 52 L 20 52 L 20 44" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5"/>
  <path d="M 52 52 L 44 52 L 44 44" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Yantra Geometric Core Symbol (Sharp Futuristic 'Y') -->
  <path d="M 19 18 L 32 34 L 45 18 L 39 18 L 32 27 L 25 18 Z" fill="url(#amberGrad)" filter="url(#glow)"/>
  <path d="M 29.5 33 L 34.5 33 L 34.5 46 L 29.5 46 Z" fill="url(#amberGrad)" filter="url(#glow)"/>

  <!-- Autonomous Center Node (Cyan Core Spark) -->
  <circle cx="32" cy="33.5" r="2" fill="#38bdf8" />

  <!-- Live Pulse Status Indicator -->
  <circle cx="49" cy="15" r="3" fill="#10b981"/>
  <circle cx="49" cy="15" r="4.5" fill="none" stroke="#10b981" stroke-width="0.75" stroke-dasharray="2 1"/>
</svg>
